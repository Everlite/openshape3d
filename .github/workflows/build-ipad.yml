name: Build iPad IPA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ipad.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build App
        run: |
          xcodebuild build \
            -project openshape3d.xcodeproj \
            -scheme openshape3d \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SWIFT_STRICT_CONCURRENCY=minimal

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData -name "openshape3d.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qr openshape3d.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openshape3d-ipad
          path: build/openshape3d.ipa
          retention-days: 7
